version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: em_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - em-network

  migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: em_migrator
    working_dir: /src
    volumes:
      - ./backend/src/EmployeeManager.Api:/src:cached
    env_file:
      - .env
    depends_on:
      - postgres
    entrypoint: >
      bash -lc "
        until (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do sleep 1; done;
        echo 'DB up; restoring and building...';
        dotnet restore /src/EmployeeManager.Api.csproj;
        dotnet build /src/EmployeeManager.Api.csproj -c Release;
        dotnet tool install --global dotnet-ef --version 8.0.0 || true;
        export PATH=$PATH:/root/.dotnet/tools;
        dotnet ef database update --project /src/EmployeeManager.Api.csproj --startup-project /src/EmployeeManager.Api.csproj;
        echo 'Migrations finished';
      "
    restart: "no"
    networks:
      - em-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: em_backend
    env_file:
      - .env
    depends_on:
      - postgres
      - migrator
    ports:
      - "8080:8080"
    networks:
      - em-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: em_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - em-network
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  postgres_data:

networks:
  em-network:
    driver: bridge
